<title>自然</title>
<article style="writing-mode: vertical-rl;text-orientation: upright;
	padding:2em;margin:auto;width:max-content;">
	<p>
	有物混成先天地生<br>
	寂兮寥兮獨立不改周行而不殆可以為天下母<br>
	吾不知其名字之曰道強為之名曰大<br>
	大曰逝逝曰遠遠曰反<br>
	故道大天大地大王亦大<br>
	域中有四大而王居其一焉<br>
	人法地地法天天法道
	</p>
	<h1 style="color: darkred;">道法自然</h1>
