function isCmsEl(el) {
	if (!el || el === document.documentElement || el === document.body) return false;
	return el.hasAttribute?.('data-cms') || el.closest?.('[data-cms]');
}

function isContainer(el) {
	return CONTAINER_TAGS.has(el.tagName);
}

function buildTagDescriptor(el) {
	let desc = el.tagName.toLowerCase();
	if (el.id && el.id !== 'cms-edit-styles' && el.id !== 'cms-runtime') desc += '#' + el.id;
	for (const cls of el.classList) {
		if (!cls.startsWith('cms-')) desc += '.' + cls;
	}
	return desc;
}

function describeElement(el) {
	if (!el) return 'document';
	let desc = '<' + el.tagName.toLowerCase();
	if (el.id) desc += '#' + el.id;
	desc += '>';
	return desc;
}

function getRepoUrl() {
	const meta = document.querySelector('meta[name="cms-repo"]');
	return meta?.content || '';
}

function getBranch() {
	return 'trunk';
}

function makeCmsEl(tag, attrs = {}) {
	const el = document.createElement(tag);
	el.setAttribute('data-cms', attrs['data-cms'] || '');
	for (const [k, v] of Object.entries(attrs)) {
		if (k === 'data-cms') continue;
		el.setAttribute(k, v);
	}
	return el;
}

// ============================================================
// Credential Management
// ============================================================
function getStoredCredentials() {
	try {
		return JSON.parse(localStorage.getItem('cms-git-credentials'));
	} catch { return null; }
}

function storeCredentials(creds) {
	localStorage.setItem('cms-git-credentials', JSON.stringify(creds));
}

function promptCredentials() {
	return new Promise((resolve) => {
		const overlay = makeCmsEl('div', {'data-cms': 'cred-overlay'});
		const dialog = makeCmsEl('div', {'data-cms': 'cred-dialog'});
		dialog.innerHTML = `
			<h3>Git Credentials</h3>
			<input data-cms placeholder="GitHub username" class="cms-cred-user">
			<input data-cms type="password" placeholder="Personal access token" class="cms-cred-token">
			<button data-cms class="cms-cred-submit">Connect</button>
			<div data-cms class="cms-cred-error"></div>
		`;
		document.body.appendChild(overlay);
		document.body.appendChild(dialog);

		const userInput = dialog.querySelector('.cms-cred-user');
		const tokenInput = dialog.querySelector('.cms-cred-token');
		const errorDiv = dialog.querySelector('.cms-cred-error');
		const submitBtn = dialog.querySelector('.cms-cred-submit');

		submitBtn.onclick = async () => {
			const creds = { username: userInput.value.trim(), token: tokenInput.value.trim() };
			if (!creds.username || !creds.token) {
				errorDiv.textContent = 'Both fields are required.';
				return;
			}
			submitBtn.textContent = 'Checking...';
			submitBtn.disabled = true;
			try {
				const resp = await fetch('https://api.github.com/user', {
					headers: { 'Authorization': 'Bearer ' + creds.token },
				});
				if (resp.ok) {
					storeCredentials(creds);
					overlay.remove();
					dialog.remove();
					resolve(creds);
				} else {
					throw new Error('HTTP ' + resp.status);
				}
			} catch (e) {
				errorDiv.textContent = 'Authentication failed. Check your token.';
				submitBtn.textContent = 'Connect';
				submitBtn.disabled = false;
			}
		};

		tokenInput.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') submitBtn.click();
		});

		overlay.onclick = () => {
			overlay.remove();
			dialog.remove();
			resolve(null);
		};
	});
}

async function validateCredentials(creds) {
	try {
		const resp = await fetch('https://api.github.com/user', {
			headers: { 'Authorization': 'Bearer ' + creds.token },
		});
		return resp.ok;
	} catch { return false; }
}

async function ensureCredentials() {
	let creds = getStoredCredentials();
	if (creds) {
		if (await validateCredentials(creds)) {
			cms.git.credentials = creds;
			return creds;
		}
		// Stored credentials are stale — clear and re-prompt
		localStorage.removeItem('cms-git-credentials');
	}
	creds = await promptCredentials();
	if (creds) {
		cms.git.credentials = creds;
		return creds;
	}
	return null;
}

// ============================================================
// Git Integration
// ============================================================
async function gitInit() {
	const dir = cms.git.dir;
	const url = getRepoUrl();
	const branch = getBranch();
	if (!url) { console.warn('CMS: No repo URL found in <meta name="cms-repo">'); return; }

	try {
		await pfs.stat(dir);
		await git.fetch({
			fs, http: window.gitHttp, dir, ref: branch, singleBranch: true,
			onAuth: () => ({ username: cms.git.credentials.username, password: cms.git.credentials.token }),
			corsProxy: cms.git.corsProxy,
		});
	} catch {
		await pfs.mkdir(dir).catch(() => {});
		await git.clone({
			fs, http: window.gitHttp, dir, url, ref: branch,
			singleBranch: true, depth: 100,
			onAuth: () => ({ username: cms.git.credentials.username, password: cms.git.credentials.token }),
			corsProxy: cms.git.corsProxy,
		});
	}

	try {
		const log = await git.log({ fs, dir, ref: branch, depth: 200 });
		cms.git.historyStack = log.map(c => c.oid).reverse();
		cms.git.historyPointer = cms.git.historyStack.length - 1;
	} catch {
		cms.git.historyStack = [];
		cms.git.historyPointer = -1;
	}
	cms.git.ready = true;
}

function serializeDocument() {
	const clone = document.documentElement.cloneNode(true);

	clone.querySelectorAll('[data-cms]').forEach(el => el.remove());

	for (const attr of ['data-cms-selected','data-cms-editing','data-cms-drop-before','data-cms-drop-after','data-cms-drop-inside','contenteditable','draggable']) {
		clone.querySelectorAll(`[${attr}]`).forEach(el => el.removeAttribute(attr));
	}

	const editStyle = clone.querySelector('#cms-edit-styles');
	if (editStyle) editStyle.setAttribute('disabled', '');

	return '<!doctype html>\n' + clone.outerHTML + '\n';
}

async function commitCurrentState(message) {
	if (!cms.git.ready) return;
	const dir = cms.git.dir;
	const html = serializeDocument();

	await pfs.writeFile(dir + '/index.html', html);
	await git.add({ fs, dir, filepath: 'index.html' });

	if (cms.git.historyPointer < cms.git.historyStack.length - 1) {
		cms.git.historyStack = cms.git.historyStack.slice(0, cms.git.historyPointer + 1);
	}

	const oid = await git.commit({
		fs, dir, message,
		author: {
			name: cms.git.credentials.username,
			email: cms.git.credentials.username + '@users.noreply.github.com',
		},
	});

	cms.git.historyStack.push(oid);
	cms.git.historyPointer = cms.git.historyStack.length - 1;
	return oid;
}

async function gitPush() {
	if (!cms.git.ready) return;
	try {
		await git.push({
			fs, http: window.gitHttp,
			dir: cms.git.dir,
			ref: getBranch(),
			onAuth: () => ({ username: cms.git.credentials.username, password: cms.git.credentials.token }),
			onAuthFailure: () => {
				localStorage.removeItem('cms-git-credentials');
				return { cancel: true };
			},
			corsProxy: cms.git.corsProxy,
		});
	} catch (e) {
		if (e.code === 'PushRejectedError' || e.code === 'PushRejectedNonFastForward') {
			showConflictDialog();
		} else if (e.code === 'UserCanceledError' || (e.code === 'HttpError' && e.data?.statusCode === 401)) {
			// Auth failed — re-prompt for credentials and retry
			const creds = await promptCredentials();
			if (creds) {
				cms.git.credentials = creds;
				await gitPush();
			}
		} else {
			console.error('CMS push error:', e);
			alert('Push failed: ' + e.message);
		}
	}
}

async function readFileFromCommit(oid, filepath) {
	const { blob } = await git.readBlob({ fs, dir: cms.git.dir, oid, filepath });
	return new TextDecoder().decode(blob);
}

// ============================================================
// Undo / Redo
// ============================================================
async function gitUndo() {
	if (!cms.git.ready || cms.git.historyPointer <= 0) return;
	if (cms.editingEl) finalizeEdit(cms.editingEl);

	cms.git.historyPointer--;
	const oid = cms.git.historyStack[cms.git.historyPointer];
	try {
		const content = await readFileFromCommit(oid, 'index.html');
		await pfs.writeFile(cms.git.dir + '/index.html', content);
		replacePageContent(content);
	} catch (e) {
		console.error('CMS undo error:', e);
		cms.git.historyPointer++;
	}
}

async function gitRedo() {
	if (!cms.git.ready || cms.git.historyPointer >= cms.git.historyStack.length - 1) return;
	if (cms.editingEl) finalizeEdit(cms.editingEl);

	cms.git.historyPointer++;
	const oid = cms.git.historyStack[cms.git.historyPointer];
	try {
		const content = await readFileFromCommit(oid, 'index.html');
		await pfs.writeFile(cms.git.dir + '/index.html', content);
		replacePageContent(content);
	} catch (e) {
		console.error('CMS redo error:', e);
		cms.git.historyPointer--;
	}
}

function replacePageContent(htmlString) {
	const parser = new DOMParser();
	const doc = parser.parseFromString(htmlString, 'text/html');

	const oldCmsEls = [];
	document.body.querySelectorAll('[data-cms]').forEach(el => oldCmsEls.push(el));

	const nonCmsChildren = [...document.body.children].filter(el => !isCmsEl(el));
	nonCmsChildren.forEach(el => el.remove());

	const newNonCms = [...doc.body.children].filter(el => !el.hasAttribute('data-cms'));
	const refNode = oldCmsEls[0] || null;
	newNonCms.forEach(el => {
		const imported = document.adoptNode(el);
		if (refNode) document.body.insertBefore(imported, refNode);
		else document.body.appendChild(imported);
	});

	document.title = doc.title;

	deselectElement();
}

// ============================================================
// Conflict Resolution
// ============================================================
async function showConflictDialog() {
	const dir = cms.git.dir;
	const branch = getBranch();

	let remoteCommits = [];
	try {
		await git.fetch({
			fs, http: window.gitHttp, dir, ref: branch, singleBranch: true,
			onAuth: () => ({ username: cms.git.credentials.username, password: cms.git.credentials.token }),
			corsProxy: cms.git.corsProxy,
		});
		const remoteLog = await git.log({ fs, dir, ref: 'remotes/origin/' + branch, depth: 20 });
		const localOids = new Set(cms.git.historyStack);
		remoteCommits = remoteLog.filter(c => !localOids.has(c.oid)).slice(0, 10);
	} catch (e) {
		console.error('CMS: error fetching remote log', e);
	}

	const overlay = makeCmsEl('div', {'data-cms': 'conflict-dialog-overlay'});
	const dialog = makeCmsEl('div', {'data-cms': 'conflict-dialog'});

	let commitList = '';
	for (const c of remoteCommits) {
		const date = new Date(c.commit.author.timestamp * 1000).toLocaleString();
		commitList += `<li>${c.oid.slice(0,7)}: "${c.commit.message.trim()}" (${date})</li>`;
	}
	if (!commitList) commitList = '<li>Unable to load remote commits</li>';

	dialog.innerHTML = `
		<h3>Remote has new changes</h3>
		<ul>${commitList}</ul>
		<div class="cms-conflict-btns">
			<button data-cms class="cms-conflict-theirs">Take theirs</button>
			<button data-cms class="cms-conflict-mine">Take mine</button>
		</div>
	`;

	document.body.appendChild(overlay);
	document.body.appendChild(dialog);

	dialog.querySelector('.cms-conflict-theirs').onclick = () => resolveConflict('theirs', overlay, dialog);
	dialog.querySelector('.cms-conflict-mine').onclick = () => resolveConflict('mine', overlay, dialog);
	overlay.onclick = () => { overlay.remove(); dialog.remove(); };
}

async function resolveConflict(strategy, overlay, dialog) {
	const dir = cms.git.dir;
	const branch = getBranch();

	try {
		if (strategy === 'theirs') {
			await git.checkout({ fs, dir, ref: 'remotes/origin/' + branch, filepaths: ['index.html'], force: true });
			const ref = await git.resolveRef({ fs, dir, ref: 'remotes/origin/' + branch });
			await pfs.writeFile(dir + '/.git/refs/heads/' + branch, ref + '\n');
			const content = await pfs.readFile(dir + '/index.html', 'utf8');
			replacePageContent(content);
			const log = await git.log({ fs, dir, ref: branch, depth: 200 });
			cms.git.historyStack = log.map(c => c.oid).reverse();
			cms.git.historyPointer = cms.git.historyStack.length - 1;
		} else {
			await git.push({
				fs, http: window.gitHttp, dir, ref: branch, force: true,
				onAuth: () => ({ username: cms.git.credentials.username, password: cms.git.credentials.token }),
				corsProxy: cms.git.corsProxy,
			});
		}
	} catch (e) {
		console.error('CMS conflict resolution error:', e);
		alert('Resolution failed: ' + e.message);
	}

	overlay.remove();
	dialog.remove();
}

// ============================================================
// Element Toolbar
// ============================================================
function createToolbar() {
	const tb = makeCmsEl('div', {'data-cms': 'toolbar'});
	tb.innerHTML = `
		<span data-cms class="cms-drag-handle" draggable="true" title="Drag to move">&#x2630;</span>
		<span data-cms class="cms-tag-desc"></span>
		<button data-cms class="cms-btn-classes" title="Edit classes">.</button>
		<button data-cms class="cms-btn-attrs" title="Edit attributes">{}</button>
		<button data-cms class="cms-btn-clone" title="Clone element">&#x2398;</button>
		<button data-cms class="cms-btn-save-el" title="Save changes" hidden>&#x2714;</button>
		<button data-cms class="cms-btn-delete" title="Delete element">&#x2715;</button>
	`;
	tb.style.display = 'none';
	document.body.appendChild(tb);
	cms.toolbarEl = tb;

	tb.querySelector('.cms-btn-clone').onclick = (e) => { e.stopPropagation(); cloneElement(); };
	tb.querySelector('.cms-btn-delete').onclick = (e) => { e.stopPropagation(); deleteElement(); };
	tb.querySelector('.cms-btn-save-el').onclick = (e) => { e.stopPropagation(); if (cms.editingEl) finalizeEdit(cms.editingEl); };
	tb.querySelector('.cms-btn-classes').onclick = (e) => { e.stopPropagation(); toggleClassEditor(); };
	tb.querySelector('.cms-btn-attrs').onclick = (e) => { e.stopPropagation(); toggleAttrEditor(); };

	const handle = tb.querySelector('.cms-drag-handle');
	handle.addEventListener('dragstart', (e) => {
		if (!cms.selectedEl) return;
		cms.draggedEl = cms.selectedEl;
		e.dataTransfer.setData('text/plain', 'cms-move');
		e.dataTransfer.effectAllowed = 'move';
		e.dataTransfer.setDragImage(cms.selectedEl, 0, 0);
	});
	handle.addEventListener('dragend', onDragEnd);
}

function updateToolbar(el) {
	if (!cms.toolbarEl) return;
	cms.toolbarEl.querySelector('.cms-tag-desc').textContent = buildTagDescriptor(el);
	updateToolbarSaveButton();
	cms.toolbarEl.style.display = '';
	// Defer positioning to next frame so the browser has painted the toolbar
	// and getBoundingClientRect() returns its actual dimensions
	requestAnimationFrame(() => positionToolbar(el));
}

function positionToolbar(el) {
	if (!cms.toolbarEl || !el) return;
	const rect = el.getBoundingClientRect();
	const tb = cms.toolbarEl;
	const tbRect = tb.getBoundingClientRect();
	let top = rect.top - tbRect.height - 4;
	let left = rect.left;
	if (top < 0) top = rect.bottom + 4;
	if (left + tbRect.width > window.innerWidth) left = window.innerWidth - tbRect.width - 4;
	if (left < 0) left = 0;
	tb.style.left = left + 'px';
	tb.style.top = top + 'px';
}

function updateToolbarSaveButton() {
	if (!cms.toolbarEl) return;
	const btn = cms.toolbarEl.querySelector('.cms-btn-save-el');
	btn.hidden = !cms.dirty.has(cms.selectedEl);
}

function hideToolbar() {
	if (cms.toolbarEl) cms.toolbarEl.style.display = 'none';
}

// ============================================================
// Element Selection
// ============================================================
function selectElement(el) {
	if (el === cms.selectedEl) return;
	deselectElement();
	cms.selectedEl = el;
	el.setAttribute('data-cms-selected', '');
	el.draggable = true;
	el._cmsDragStart = (e) => {
		if (cms.editingEl === el) return; // don't drag while editing text
		cms.draggedEl = el;
		e.dataTransfer.setData('text/plain', 'cms-move');
		e.dataTransfer.effectAllowed = 'move';
	};
	el._cmsDragEnd = onDragEnd;
	el.addEventListener('dragstart', el._cmsDragStart);
	el.addEventListener('dragend', el._cmsDragEnd);
	updateToolbar(el);
}

function deselectElement() {
	closeClassEditor();
	closeAttrEditor();
	closeLinkEditor();
	if (cms.editingEl) finalizeEdit(cms.editingEl);
	if (cms.selectedEl) {
		cms.selectedEl.removeAttribute('data-cms-selected');
		cms.selectedEl.draggable = false;
		if (cms.selectedEl._cmsDragStart) {
			cms.selectedEl.removeEventListener('dragstart', cms.selectedEl._cmsDragStart);
			cms.selectedEl.removeEventListener('dragend', cms.selectedEl._cmsDragEnd);
			delete cms.selectedEl._cmsDragStart;
			delete cms.selectedEl._cmsDragEnd;
		}
		cms.selectedEl = null;
	}
	hideToolbar();
}

function onDocumentClick(e) {
	if (cms.mode !== 'edit') return;
	if (isCmsEl(e.target)) return;

	e.preventDefault();
	e.stopPropagation();

	const el = e.target;
	if (el === document.body || el === document.documentElement) {
		deselectElement();
		return;
	}
	selectElement(el);
}

function onDocumentDblClick(e) {
	if (cms.mode !== 'edit') return;
	if (isCmsEl(e.target)) return;

	e.preventDefault();
	e.stopPropagation();

	const el = e.target;
	if (el === document.body || el === document.documentElement) return;

	selectElement(el);
	startEditing(el);
}

function onKeyDown(e) {
	if (cms.mode !== 'edit') return;
	if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
		e.preventDefault();
		gitUndo();
	} else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
		e.preventDefault();
		gitRedo();
	} else if (e.key === 'Escape') {
		if (cms.editingEl) {
			finalizeEdit(cms.editingEl);
		} else if (cms.selectedEl) {
			deselectElement();
		}
	} else if (e.key === 'Delete' && !cms.editingEl && cms.selectedEl) {
		e.preventDefault();
		deleteElement();
	}
}

function onScroll() {
	if (cms.selectedEl) positionToolbar(cms.selectedEl);
}

function onDocumentMouseDown(e) {
	if (cms.mode !== 'edit') return;
	if (isCmsEl(e.target)) return;
	const el = e.target;
	if (el === document.body || el === document.documentElement) return;
	// If we're editing this element, don't initiate drag (allow text selection)
	if (cms.editingEl === el) return;
	// Select immediately so draggable=true is set before the drag gesture starts
	selectElement(el);
}

// ============================================================
// Inline Editing
// ============================================================
function startEditing(el) {
	if (cms.editingEl === el) return;
	if (cms.editingEl) finalizeEdit(cms.editingEl);

	if (el.tagName === 'IMG') {
		startImageEdit(el);
		return;
	}

	cms.editingEl = el;

	if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') {
		cms.snapshots.set(el, el.textContent);
	} else {
		cms.snapshots.set(el, el.innerHTML);
	}

	el.setAttribute('data-cms-editing', '');
	el.removeAttribute('data-cms-selected');
	el.contentEditable = 'true';
	el.focus();

	el._cmsInputHandler = () => checkDirty(el);
	el.addEventListener('input', el._cmsInputHandler);

	// Shift+Enter inserts <br>; Enter creates a sibling element
	const SAME_TAG_ON_ENTER = new Set(['P','LI','DD','DT','BLOCKQUOTE','TR']);
	el._cmsKeydownHandler = (e) => {
		if (e.key !== 'Enter') return;
		if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') return; // normal newlines in code
		e.preventDefault();
		if (e.shiftKey) {
			document.execCommand('insertLineBreak');
		} else {
			// Finalize this element, then create a sibling
			const tag = SAME_TAG_ON_ENTER.has(el.tagName) ? el.tagName.toLowerCase() : 'p';
			finalizeEdit(el);
			const sibling = document.createElement(tag);
			sibling.innerHTML = '<br>';
			el.parentNode.insertBefore(sibling, el.nextSibling);
			const msg = `Add ${describeElement(sibling)} after ${describeElement(el)}`;
			commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
			selectElement(sibling);
			startEditing(sibling);
		}
	};
	el.addEventListener('keydown', el._cmsKeydownHandler);

	if (el.closest('a') || el.tagName === 'A') {
		const aEl = el.tagName === 'A' ? el : el.closest('a');
		openLinkEditor(aEl);
	}
}

function finalizeEdit(el) {
	if (!el) return;

	let changed = false;
	const snapshot = cms.snapshots.get(el);
	if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') {
		changed = el.textContent !== snapshot;
	} else {
		changed = el.innerHTML !== snapshot;
	}

	if (changed) {
		const msg = `Edit ${describeElement(el)} in ${describeElement(el.parentElement)}`;
		commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
	}

	cms.dirty.delete(el);
	el.removeAttribute('data-cms-editing');
	el.removeAttribute('contenteditable');
	if (el._cmsInputHandler) {
		el.removeEventListener('input', el._cmsInputHandler);
		delete el._cmsInputHandler;
	}
	if (el._cmsKeydownHandler) {
		el.removeEventListener('keydown', el._cmsKeydownHandler);
		delete el._cmsKeydownHandler;
	}
	cms.snapshots.delete(el);
	cms.editingEl = null;

	closeLinkEditor();

	if (cms.selectedEl === el || !cms.selectedEl) {
		cms.selectedEl = el;
		el.setAttribute('data-cms-selected', '');
		updateToolbar(el);
	}
}

function checkDirty(el) {
	const original = cms.snapshots.get(el);
	const current = (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') ? el.textContent : el.innerHTML;
	if (current !== original) {
		cms.dirty.add(el);
	} else {
		cms.dirty.delete(el);
	}
	updateToolbarSaveButton();
}

// ============================================================
// Clone / Delete
// ============================================================
function cloneElement() {
	const el = cms.selectedEl;
	if (!el) return;
	const clone = el.cloneNode(true);
	clone.removeAttribute('data-cms-selected');
	clone.removeAttribute('data-cms-editing');
	clone.removeAttribute('contenteditable');
	el.parentNode.insertBefore(clone, el.nextSibling);
	const msg = `Clone ${describeElement(el)} in ${describeElement(el.parentElement)}`;
	commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
	selectElement(clone);
}

function deleteElement() {
	const el = cms.selectedEl;
	if (!el) return;
	const msg = `Delete ${describeElement(el)} from ${describeElement(el.parentElement)}`;
	deselectElement();
	el.remove();
	commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
}

// ============================================================
// Image Editing
// ============================================================
function startImageEdit(imgEl) {
	const input = makeCmsEl('input', {'data-cms': ''});
	input.type = 'file';
	input.accept = 'image/*';
	input.style.display = 'none';
	document.body.appendChild(input);

	input.onchange = () => {
		const file = input.files[0];
		if (!file) { input.remove(); return; }
		const reader = new FileReader();
		reader.onload = () => {
			imgEl.src = reader.result;
			const msg = `Replace image in ${describeElement(imgEl.parentElement)}`;
			commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
			input.remove();
		};
		reader.readAsDataURL(file);
	};
	input.click();
}

// ============================================================
// Class Editor
// ============================================================
function getAllDefinedClasses() {
	const classes = new Set();
	for (const sheet of document.styleSheets) {
		try {
			for (const rule of sheet.cssRules) {
				extractClassesFromRule(rule, classes);
			}
		} catch { /* cross-origin */ }
	}
	for (const el of document.querySelectorAll('[class]')) {
		if (isCmsEl(el)) continue;
		for (const cls of el.classList) {
			if (!cls.startsWith('cms-')) classes.add(cls);
		}
	}
	for (const tmpl of document.querySelectorAll('template')) {
		for (const el of tmpl.content.querySelectorAll('[class]')) {
			for (const cls of el.classList) {
				if (!cls.startsWith('cms-')) classes.add(cls);
			}
		}
	}
	return [...classes].sort();
}

function extractClassesFromRule(rule, classes) {
	if (rule.selectorText) {
		for (const match of rule.selectorText.matchAll(/\.([a-zA-Z_][\w-]*)/g)) {
			if (!match[1].startsWith('cms-')) classes.add(match[1]);
		}
	}
	if (rule.cssRules) {
		for (const inner of rule.cssRules) extractClassesFromRule(inner, classes);
	}
}

function toggleClassEditor() {
	if (cms.classEditorEl) { closeClassEditor(); return; }
	if (!cms.selectedEl) return;
	openClassEditor(cms.selectedEl);
}

function openClassEditor(el) {
	closeClassEditor();
	const editor = makeCmsEl('div', {'data-cms': 'class-editor'});
	cms.classEditorEl = editor;

	const tagsDiv = makeCmsEl('div', {'data-cms': ''});
	tagsDiv.className = 'cms-class-tags';

	const input = makeCmsEl('input', {'data-cms': ''});
	input.className = 'cms-class-input';
	input.placeholder = 'Add class...';

	const suggestionsDiv = makeCmsEl('div', {'data-cms': ''});
	suggestionsDiv.className = 'cms-class-suggestions';

	editor.appendChild(tagsDiv);
	editor.appendChild(input);
	editor.appendChild(suggestionsDiv);
	document.body.appendChild(editor);

	const snapshotClasses = [...el.classList].filter(c => !c.startsWith('cms-'));
	cms.snapshots.set('classes:' + el.tagName, snapshotClasses.join(' '));

	function renderTags() {
		tagsDiv.innerHTML = '';
		for (const cls of el.classList) {
			if (cls.startsWith('cms-')) continue;
			const tag = makeCmsEl('span', {'data-cms': ''});
			tag.className = 'cms-class-tag';
			tag.textContent = cls + ' ';
			const removeBtn = makeCmsEl('button', {'data-cms': ''});
			removeBtn.textContent = '\u00d7';
			removeBtn.onclick = (e) => {
				e.stopPropagation();
				el.classList.remove(cls);
				renderTags();
				checkClassDirty(el);
			};
			tag.appendChild(removeBtn);
			tagsDiv.appendChild(tag);
		}
	}

	function renderSuggestions(filter) {
		suggestionsDiv.innerHTML = '';
		const all = getAllDefinedClasses();
		const current = new Set(el.classList);
		const filtered = all.filter(c => !current.has(c) && (!filter || c.includes(filter)));
		for (const cls of filtered.slice(0, 20)) {
			const item = makeCmsEl('div', {'data-cms': ''});
			item.className = 'cms-class-suggestion';
			item.textContent = cls;
			item.onclick = (e) => {
				e.stopPropagation();
				el.classList.add(cls);
				input.value = '';
				renderTags();
				renderSuggestions('');
				checkClassDirty(el);
			};
			suggestionsDiv.appendChild(item);
		}
	}

	input.addEventListener('input', () => renderSuggestions(input.value.trim()));
	input.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && input.value.trim()) {
			e.preventDefault();
			el.classList.add(input.value.trim());
			input.value = '';
			renderTags();
			renderSuggestions('');
			checkClassDirty(el);
		} else if (e.key === 'Escape') {
			closeClassEditor();
		}
	});

	renderTags();
	renderSuggestions('');
	positionEditor(editor, el);
	input.focus();
}

function checkClassDirty(el) {
	cms.dirty.add(el);
	updateToolbarSaveButton();
}

function closeClassEditor() {
	if (!cms.classEditorEl) return;

	if (cms.selectedEl) {
		const key = 'classes:' + cms.selectedEl.tagName;
		const original = cms.snapshots.get(key);
		const current = [...cms.selectedEl.classList].filter(c => !c.startsWith('cms-')).join(' ');
		if (original !== undefined && original !== current) {
			const msg = `Edit classes on ${describeElement(cms.selectedEl)}`;
			commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
			cms.dirty.delete(cms.selectedEl);
			updateToolbarSaveButton();
		}
		cms.snapshots.delete(key);
	}

	cms.classEditorEl.remove();
	cms.classEditorEl = null;
}

// ============================================================
// Attribute Editor
// ============================================================
function toggleAttrEditor() {
	if (cms.attrEditorEl) { closeAttrEditor(); return; }
	if (!cms.selectedEl) return;
	openAttrEditor(cms.selectedEl);
}

function openAttrEditor(el) {
	closeAttrEditor();
	const editor = makeCmsEl('div', {'data-cms': 'attr-editor'});
	cms.attrEditorEl = editor;

	const snapshotAttrs = {};
	for (const attr of el.attributes) {
		if (!SKIP_ATTRS.has(attr.name) && !attr.name.startsWith('data-cms')) {
			snapshotAttrs[attr.name] = attr.value;
		}
	}
	cms.snapshots.set('attrs:' + el.tagName, JSON.stringify(snapshotAttrs));

	function render() {
		editor.innerHTML = '';
		for (const attr of el.attributes) {
			if (SKIP_ATTRS.has(attr.name) || attr.name.startsWith('data-cms')) continue;
			const row = makeCmsEl('div', {'data-cms': ''});
			row.className = 'cms-attr-row';

			const keyInput = makeCmsEl('input', {'data-cms': ''});
			keyInput.className = 'cms-attr-key';
			keyInput.value = attr.name;
			keyInput.readOnly = true;

			const valInput = makeCmsEl('input', {'data-cms': ''});
			valInput.className = 'cms-attr-val';
			valInput.value = attr.value;
			valInput.addEventListener('change', () => {
				el.setAttribute(attr.name, valInput.value);
			});

			const delBtn = makeCmsEl('button', {'data-cms': ''});
			delBtn.textContent = '\u00d7';
			delBtn.onclick = () => {
				el.removeAttribute(attr.name);
				render();
			};

			row.appendChild(keyInput);
			row.appendChild(valInput);
			row.appendChild(delBtn);
			editor.appendChild(row);
		}

		const addRow = makeCmsEl('div', {'data-cms': ''});
		addRow.className = 'cms-attr-add';
		const newKey = makeCmsEl('input', {'data-cms': ''});
		newKey.className = 'cms-attr-key';
		newKey.placeholder = 'attr';
		const newVal = makeCmsEl('input', {'data-cms': ''});
		newVal.className = 'cms-attr-val';
		newVal.placeholder = 'value';
		const addBtn = makeCmsEl('button', {'data-cms': ''});
		addBtn.textContent = '+';
		addBtn.onclick = () => {
			if (newKey.value.trim()) {
				el.setAttribute(newKey.value.trim(), newVal.value);
				render();
			}
		};
		addRow.appendChild(newKey);
		addRow.appendChild(newVal);
		addRow.appendChild(addBtn);
		editor.appendChild(addRow);
	}

	render();
	document.body.appendChild(editor);
	positionEditor(editor, el);
}

function closeAttrEditor() {
	if (!cms.attrEditorEl) return;

	if (cms.selectedEl) {
		const key = 'attrs:' + cms.selectedEl.tagName;
		const original = cms.snapshots.get(key);
		if (original !== undefined) {
			const current = {};
			for (const attr of cms.selectedEl.attributes) {
				if (!SKIP_ATTRS.has(attr.name) && !attr.name.startsWith('data-cms')) {
					current[attr.name] = attr.value;
				}
			}
			if (JSON.stringify(current) !== original) {
				const msg = `Edit attributes on ${describeElement(cms.selectedEl)}`;
				commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
			}
		}
		cms.snapshots.delete(key);
	}

	cms.attrEditorEl.remove();
	cms.attrEditorEl = null;
}

function positionEditor(editor, el) {
	const rect = el.getBoundingClientRect();
	const tbRect = cms.toolbarEl?.getBoundingClientRect();
	let top = tbRect ? tbRect.bottom + 4 : rect.top - 4;
	let left = tbRect ? tbRect.left : rect.left;
	if (top + 200 > window.innerHeight) top = rect.top - 200;
	if (left + 320 > window.innerWidth) left = window.innerWidth - 324;
	if (left < 4) left = 4;
	if (top < 4) top = 4;
	editor.style.left = left + 'px';
	editor.style.top = top + 'px';
}

// ============================================================
// Link Editor
// ============================================================
function openLinkEditor(aEl) {
	closeLinkEditor();
	const editor = makeCmsEl('div', {'data-cms': 'link-editor'});
	const input = makeCmsEl('input', {'data-cms': ''});
	input.type = 'url';
	input.value = aEl.getAttribute('href') || '';
	const confirmBtn = makeCmsEl('button', {'data-cms': ''});
	confirmBtn.innerHTML = '&#x2714;';

	editor.appendChild(input);
	editor.appendChild(confirmBtn);
	document.body.appendChild(editor);
	cms.linkEditorEl = editor;

	const rect = aEl.getBoundingClientRect();
	editor.style.left = rect.left + 'px';
	editor.style.top = (rect.bottom + 4) + 'px';

	const apply = () => { aEl.setAttribute('href', input.value); };
	confirmBtn.onclick = (e) => { e.stopPropagation(); apply(); closeLinkEditor(); };
	input.addEventListener('keydown', (e) => {
		if (e.key === 'Enter') { e.preventDefault(); apply(); closeLinkEditor(); }
		if (e.key === 'Escape') closeLinkEditor();
		e.stopPropagation();
	});
	input.addEventListener('click', (e) => e.stopPropagation());
}

function closeLinkEditor() {
	if (!cms.linkEditorEl) return;
	cms.linkEditorEl.remove();
	cms.linkEditorEl = null;
}

// ============================================================
// Block Palette
// ============================================================
function createPalette() {
	const palette = makeCmsEl('div', {'data-cms': 'palette'});
	const list = makeCmsEl('div', {'data-cms': ''});
	list.className = 'cms-palette-list';

	const templates = [...document.querySelectorAll('template')];
	templates.forEach((tmpl, idx) => {
		const item = makeCmsEl('div', {'data-cms': ''});
		item.className = 'cms-palette-item';
		item.draggable = true;
		item.dataset.cmsTemplateIndex = idx;

		const preview = makeCmsEl('div', {'data-cms': ''});
		preview.className = 'cms-palette-preview';
		const inner = document.createElement('div');
		inner.appendChild(tmpl.content.cloneNode(true));
		preview.appendChild(inner);

		item.appendChild(preview);
		list.appendChild(item);

		item.addEventListener('dragstart', (e) => {
			e.dataTransfer.setData('text/plain', 'cms-template');
			e.dataTransfer.setData('cms-template-index', String(idx));
			e.dataTransfer.effectAllowed = 'copy';
		});
		item.addEventListener('dragend', onDragEnd);
	});

	palette.appendChild(list);
	document.body.appendChild(palette);
	cms.paletteEl = palette;
}

function togglePalette() {
	if (!cms.paletteEl) return;
	cms.paletteEl.classList.toggle('open');
}

// ============================================================
// Drag and Drop
// ============================================================
function onDocumentDragOver(e) {
	if (cms.mode !== 'edit') return;
	const target = document.elementFromPoint(e.clientX, e.clientY);
	if (!target || isCmsEl(target) || target === document.body || target === document.documentElement) {
		clearDropIndicators();
		return;
	}

	e.preventDefault();
	e.dataTransfer.dropEffect = cms.draggedEl ? 'move' : 'copy';
	clearDropIndicators();

	const rect = target.getBoundingClientRect();
	const relY = (e.clientY - rect.top) / rect.height;

	if (isContainer(target) && relY > 0.33 && relY < 0.67) {
		target.setAttribute('data-cms-drop-inside', '');
		cms.dropTarget = target;
		cms.dropPosition = 'inside';
	} else if (relY <= 0.5) {
		target.setAttribute('data-cms-drop-before', '');
		cms.dropTarget = target;
		cms.dropPosition = 'before';
	} else {
		target.setAttribute('data-cms-drop-after', '');
		cms.dropTarget = target;
		cms.dropPosition = 'after';
	}
}

function onDocumentDrop(e) {
	if (cms.mode !== 'edit') return;
	e.preventDefault();
	clearDropIndicators();

	const target = cms.dropTarget;
	const position = cms.dropPosition;
	if (!target) return;

	const type = e.dataTransfer.getData('text/plain');

	if (type === 'cms-template') {
		const idx = parseInt(e.dataTransfer.getData('cms-template-index'));
		const templates = [...document.querySelectorAll('template')];
		if (templates[idx]) {
			const fragment = templates[idx].content.cloneNode(true);
			const wrapper = document.createElement('div');
			wrapper.appendChild(fragment);
			const nodes = [...wrapper.childNodes];

			nodes.forEach(node => {
				insertAtDropPosition(node, target, position);
			});

			const msg = `Add block to ${describeElement(position === 'inside' ? target : target.parentElement)}`;
			commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
		}
	} else if (type === 'cms-move' && cms.draggedEl) {
		const el = cms.draggedEl;
		if (el !== target && !el.contains(target)) {
			insertAtDropPosition(el, target, position);
			const msg = `Move ${describeElement(el)} to ${describeElement(position === 'inside' ? target : target.parentElement)}`;
			commitCurrentState(msg).catch(e => console.error('CMS commit error:', e));
			selectElement(el);
		}
	}

	cms.draggedEl = null;
	cms.dropTarget = null;
	cms.dropPosition = null;
}

function onDragEnd() {
	clearDropIndicators();
	cms.draggedEl = null;
	cms.dropTarget = null;
	cms.dropPosition = null;
}

function insertAtDropPosition(node, target, position) {
	if (position === 'before') {
		target.parentNode.insertBefore(node, target);
	} else if (position === 'after') {
		target.parentNode.insertBefore(node, target.nextSibling);
	} else if (position === 'inside') {
		target.appendChild(node);
	}
}

function clearDropIndicators() {
	for (const attr of ['data-cms-drop-before','data-cms-drop-after','data-cms-drop-inside']) {
		document.querySelectorAll(`[${attr}]`).forEach(el => el.removeAttribute(attr));
	}
}

// ============================================================
// Edit Mode Entry / Exit
// ============================================================
window.enterEditMode = async function() {
	if (cms.mode === 'edit') return;

	const creds = await ensureCredentials();
	if (!creds) return;

	cms.mode = 'edit';
	document.getElementById('cms-edit-styles').disabled = false;

	createToolbar();
	createFab();
	createPalette();

	document.addEventListener('click', onDocumentClick, true);
	document.addEventListener('dblclick', onDocumentDblClick, true);
	document.addEventListener('mousedown', onDocumentMouseDown, true);
	document.addEventListener('keydown', onKeyDown, true);
	document.addEventListener('dragover', onDocumentDragOver);
	document.addEventListener('drop', onDocumentDrop);
	cms.scrollHandler = onScroll;
	window.addEventListener('scroll', cms.scrollHandler, true);
	window.addEventListener('resize', cms.scrollHandler);

	gitInit().catch(e => console.error('CMS git init error:', e));
};

window.exitEditMode = async function(action) {
	if (cms.mode !== 'edit') return;

	if (cms.editingEl) finalizeEdit(cms.editingEl);
	deselectElement();

	if (action === 'discard') {
		if (cms.git.ready && cms.git.historyStack.length > 0) {
			try {
				const oid = cms.git.historyStack[cms.git.historyStack.length - 1];
				const content = await readFileFromCommit(oid, 'index.html');
				replacePageContent(content);
			} catch (e) { console.error('CMS discard error:', e); }
		}
	} else if (action === 'save') {
		await commitCurrentState('Save page').catch(e => console.error('CMS commit error:', e));
	} else if (action === 'publish') {
		await commitCurrentState('Publish page').catch(e => console.error('CMS commit error:', e));
		await gitPush();
	}

	document.querySelectorAll('[data-cms]').forEach(el => el.remove());

	for (const attr of ['data-cms-selected','data-cms-editing','data-cms-drop-before','data-cms-drop-after','data-cms-drop-inside','contenteditable','draggable']) {
		document.querySelectorAll(`[${attr}]`).forEach(el => el.removeAttribute(attr));
	}

	document.getElementById('cms-edit-styles').disabled = true;

	document.removeEventListener('click', onDocumentClick, true);
	document.removeEventListener('dblclick', onDocumentDblClick, true);
	document.removeEventListener('mousedown', onDocumentMouseDown, true);
	document.removeEventListener('keydown', onKeyDown, true);
	document.removeEventListener('dragover', onDocumentDragOver);
	document.removeEventListener('drop', onDocumentDrop);
	if (cms.scrollHandler) {
		window.removeEventListener('scroll', cms.scrollHandler, true);
		window.removeEventListener('resize', cms.scrollHandler);
	}

	cms.toolbarEl = null;
	cms.fabEl = null;
	cms.paletteEl = null;
	cms.classEditorEl = null;
	cms.attrEditorEl = null;
	cms.linkEditorEl = null;
	cms.selectedEl = null;
	cms.editingEl = null;
	cms.dirty.clear();
	cms.snapshots.clear();
	cms.mode = 'view';
};

// Legacy alias for the existing trigger
window.editPage = window.enterEditMode;
</script>
