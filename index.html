<nav id="editPageNav">
	<button onclick="cancelEdit()">&times;</button>
	<button onclick="saveEdit()">💾</button>
</nav>
<style>
	#editPageNav {
		display: none;
	}
</style>
<style id="editStyleSheet">
	#editPageNav {
		display: block;
		position: fixed;
		bottom: 1rem;
		right: 1rem;
	}
	style, script {
		display: block;
		white-space: pre;
		font-family: monospace;
	}
</style>
<script>
	window.editing = false;
	const lastSavedState = localStorage.getItem('editPageState');
	if (document.rootElement.outerHTML !== lastSavedState) document.rootElement.outerHTML = lastSavedState;
	const editStyleSheet = document.getElementById('editStyleSheet')
	editStyleSheet.disabled = true;
	function editPage() {
		if (editing) return;
		editStyleSheet.disabled = false;
		editing = true;
		for (const child of document.body.children) child.contentEditable = true;
	}
	function discardEdit() {
		cancelEdit();
		document.rootElement.outerHTML = localStorage.getItem('editPageState');
	}
	function cancelEdit() {
		if (!editing) return;
		editStyleSheet.disabled = true;
		editing = false;
		for (const child of document.body.children) child.contentEditable = false;
	}
	function saveEdit() {
		cancelEdit();
		localStorage.setItem('editPageState', document.rootElement.outerHTML);
	}
</script>
